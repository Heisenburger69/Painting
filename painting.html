<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier — Painting Detail</title>
    <meta name="description" content="View artwork details, description, and pricing.">
    <meta property="og:title" content="Atelier — Painting Detail">
    <meta property="og:description" content="Original painting for sale.">
    <meta property="og:url" content="https://atelier.art">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <style>
        .painting-header { text-align: center; padding: 70px 20px; background: linear-gradient(135deg, var(--space-cadet) 0%, #1a1c2e 100%); }
        .painting-header h1 { color: var(--coffee); }
        .painting-meta { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 16px; }
        .painting-content { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

        .painting-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }

        .painting-main-image {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .painting-main-image img {
            width: 100%;
            display: block;
        }

        .painting-info h2 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .painting-info .painting-medium {
            font-size: 16px;
            color: var(--tan);
            font-style: italic;
            margin-bottom: 8px;
        }

        .painting-info .painting-specs {
            font-size: 14px;
            color: var(--slate-gray);
            margin-bottom: 20px;
        }

        .painting-info .painting-description {
            font-size: 16px;
            line-height: 1.9;
            margin-bottom: 24px;
            color: var(--space-cadet);
        }

        .painting-info .painting-price-box {
            background: linear-gradient(135deg, rgba(212, 167, 106, 0.15) 0%, rgba(212, 167, 106, 0.05) 100%);
            border: 1px solid rgba(212, 167, 106, 0.3);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .painting-info .painting-price {
            font-size: 32px;
            font-weight: 900;
            color: var(--caput-mortuum);
        }

        .painting-info .painting-price.sold {
            color: var(--slate-gray);
            text-decoration: line-through;
        }

        .painting-images-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 30px;
        }

        .painting-images-grid img {
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            aspect-ratio: 1;
            object-fit: cover;
        }

        .painting-images-grid img:hover {
            transform: scale(1.03);
            box-shadow: var(--shadow-md);
        }

        @media (max-width: 768px) {
            .painting-detail-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .painting-info h2 {
                font-size: 24px;
            }

            .painting-info .painting-price {
                font-size: 24px;
            }

            .painting-images-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="bg-stars"></div>

    <nav class="navbar">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="logo">
                <span style="color:var(--tan);font-weight:900;font-size:22px;letter-spacing:2px;text-transform:uppercase;">Atelier</span>
            </a>
            <a href="javascript:void(0)" onclick="window.history.back()" class="btn btn-primary" style="padding:8px 16px;font-size:12px;">&larr; Back</a>
        </div>
    </nav>

    <article>
        <div class="painting-header">
            <h1 id="paintingTitle">Loading...</h1>
            <p class="painting-meta" id="paintingMeta">Atelier — Original Painting</p>
        </div>
        <div class="painting-content" id="paintingContent">
            <p style="text-align:center;color:var(--slate-gray);padding:60px 0;">Loading painting details...</p>
        </div>
    </article>

    <footer class="footer">
        <div class="container">
            <p><strong>ATELIER</strong></p>
            <p>Original Paintings & Fine Art</p>
            <p>&copy; 2026 All Rights Reserved</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script>
        const paintingId = new URLSearchParams(window.location.search).get('id') || '';

        async function init() {
            await DataStore.load();
            loadPainting();
        }

        function loadPainting() {
            const painting = DataStore.getPainting(paintingId);
            if (!painting) {
                document.getElementById('paintingTitle').textContent = 'Painting Not Found';
                document.getElementById('paintingContent').innerHTML = '<p style="text-align:center;color:var(--slate-gray);padding:60px 0;">The requested painting could not be found.</p>';
                return;
            }

            document.getElementById('paintingTitle').textContent = painting.title;
            document.getElementById('paintingMeta').textContent = `${painting.medium} | ${painting.size} | ${painting.year} | ${painting.category}`;

            const content = document.getElementById('paintingContent');
            const allImages = painting.images || [painting.image];
            const extraImages = allImages.filter(img => img !== painting.image);

            let html = `
                <div class="painting-detail-grid">
                    <div>
                        <div class="painting-main-image">
                            <img src="${painting.image}" alt="${painting.title}" id="mainImage" onerror="this.style.display='none'">
                        </div>
                        ${extraImages.length > 0 ? `
                        <div class="painting-images-grid">
                            ${extraImages.map(img => `
                                <img src="${img}" alt="${painting.title} view" onerror="this.style.display='none'" onclick="document.getElementById('mainImage').src=this.src">
                            `).join('')}
                        </div>` : ''}
                    </div>
                    <div class="painting-info">
                        <h2>${painting.title}</h2>
                        <p class="painting-medium">${painting.medium}</p>
                        <p class="painting-specs">${painting.size} — ${painting.year} — ${painting.category}</p>
                        <p class="painting-description">${painting.description}</p>
                        <div class="painting-price-box">
                            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--slate-gray);margin-bottom:4px;">
                                ${painting.sold ? 'Status: Sold' : 'Price'}
                            </div>
                            <div class="painting-price ${painting.sold ? 'sold' : ''}">
                                ${painting.sold ? 'SOLD' : painting.currency + ' ' + painting.price.toLocaleString()}
                            </div>
                            ${painting.sold ? '<p style="font-size:13px;color:var(--caput-mortuum);margin-top:8px;">This piece has been acquired.</p>' : '<p style="font-size:13px;color:var(--slate-gray);margin-top:8px;">Contact for inquiries and acquisition</p>'}
                        </div>
                        <a href="index.html#gallery" class="btn btn-primary">Back to Gallery</a>
                        <a href="#contacts" class="btn btn-coffee" onclick="event.preventDefault();window.location.href=\'index.html#contacts\'">Inquire</a>
                    </div>
                </div>
            `;

            content.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
